<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Escuelas CECATI</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 350px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .sidebar-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .filter-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .filter-section h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1rem;
        }
        
        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .course-filters {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .course-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .course-item:last-child {
            border-bottom: none;
        }
        
        .course-item input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        
        .course-item label {
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            flex: 1;
        }
        
        .stats {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .stat-label {
            color: #666;
        }
        
        .stat-value {
            font-weight: bold;
            color: #333;
        }
        
        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin-top: 15px;
        }
        
        .reset-btn:hover {
            background: #ff5252;
        }
        
        .map-container {
            flex: 1;
            position: relative;
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        .school-popup {
            min-width: 250px;
        }
        
        .school-popup h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .school-popup .address {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .school-popup .courses {
            margin-top: 10px;
        }
        
        .school-popup .courses h5 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        
        .course-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
        }
        
        .course-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin: 2px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 40vh;
                order: 2;
            }
            
            .map-container {
                height: 60vh;
                order: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>CECATI</h1>
                <p>Mapa Interactivo de Escuelas</p>
            </div>
            
            <div class="filter-section">
                <h3>Buscar Cursos</h3>
                <input type="text" class="search-box" id="courseSearch" placeholder="Buscar cursos disponibles...">
                
                <div class="course-filters" id="courseFilters">
                    <!-- Course checkboxes will be populated here -->
                </div>
                
                <button class="reset-btn" onclick="resetFilters()">Limpiar Filtros</button>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Escuelas mostradas:</span>
                    <span class="stat-value" id="schoolCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total de escuelas:</span>
                    <span class="stat-value" id="totalSchools">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Cursos seleccionados:</span>
                    <span class="stat-value" id="selectedCourses">0</span>
                </div>
            </div>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

        // Course data
        const courseData = {

            "Estilismo y diseño de imagen": [1,3,13,14,73,74,75,99,127,156,157,158,162,167,171,173,176,187,188,194],

            "Instalaciones hidráulicas y de gas": [1,73],

            "Programación y aplicaciones web y móviles": [1,2,3,4,11,12,13,14,25,58,66,73,74,75,127,128,152,153,155,156,157,158,162,167,171,173,176,187,188,194],
            "Prótesis dental": [73,194],
            "Prótesis y órtesis": [171],
            "Refrigeración y aire acondicionado": [11],
            "Salud visual": [194],

            "Tapicería": [12,13]
        };

        let map;
        let markers = [];
        let markerGroup;
        
        // Initialize the map
        function initMap() {
            // Center on Mexico City
            map = L.map('map').setView([19.4326, -99.1332], 11);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            markerGroup = L.layerGroup().addTo(map);
            
            // Add all markers initially
            addAllMarkers();
            
            // Update stats
            updateStats();
        }
        
        function addAllMarkers() {
            Object.keys(schoolData).forEach(schoolId => {
                const school = schoolData[schoolId];
                const schoolCourses = getSchoolCourses(schoolId);
                
                const marker = L.marker([school.lat, school.lng])
                    .bindPopup(createPopupContent(schoolId, school, schoolCourses));
                
                markers.push({
                    marker: marker,
                    schoolId: schoolId,
                    courses: schoolCourses
                });
                
                markerGroup.addLayer(marker);
            });
        }
        
        function getSchoolCourses(schoolId) {
            const courses = [];
            Object.keys(courseData).forEach(courseName => {
                if (courseData[courseName].includes(parseInt(schoolId))) {
                    courses.push(courseName);
                }
            });
            return courses;
        }
        
        function createPopupContent(schoolId, school, courses) {
            let courseHtml = courses.map(course => 
                `<span class="course-tag">${course}</span>`
            ).join('');
            
            return `
                <div class="school-popup">
                    <h4>CECATI ${schoolId}</h4>
                    <div class="address">${school.address}</div>
                    <div class="courses">
                        <h5>Cursos disponibles (${courses.length}):</h5>
                        <div class="course-list">
                            ${courseHtml}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function initFilters() {
            const filtersContainer = document.getElementById('courseFilters');
            const searchBox = document.getElementById('courseSearch');
            
            Object.keys(courseData).sort().forEach(courseName => {
                const courseItem = document.createElement('div');
                courseItem.className = 'course-item';
                courseItem.innerHTML = `
                    <input type="checkbox" id="course-${courseName}" value="${courseName}" onchange="applyFilters()">
                    <label for="course-${courseName}">${courseName}</label>
                `;
                filtersContainer.appendChild(courseItem);
            });
            
            // Search functionality
            searchBox.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const courseItems = filtersContainer.querySelectorAll('.course-item');
                
                courseItems.forEach(item => {
                    const label = item.querySelector('label').textContent.toLowerCase();
                    item.style.display = label.includes(searchTerm) ? 'flex' : 'none';
                });
            });
        }
        
        function applyFilters() {
            const checkedCourses = Array.from(document.querySelectorAll('#courseFilters input:checked'))
                .map(input => input.value);
            
            // Clear current markers
            markerGroup.clearLayers();
            
            if (checkedCourses.length === 0) {
                // Show all markers if no filters selected
                markers.forEach(markerData => {
                    markerGroup.addLayer(markerData.marker);
                });
            } else {
                // Show schools that offer ANY of the selected courses
                markers.forEach(markerData => {
                    const hasAnyCourse = checkedCourses.some(course => 
                        markerData.courses.includes(course)
                    );
                    
                    if (hasAnyCourse) {
                        markerGroup.addLayer(markerData.marker);
                    }
                });
            }
            
            updateStats();
        }
        
        function resetFilters() {
            // Uncheck all checkboxes
            document.querySelectorAll('#courseFilters input').forEach(input => {
                input.checked = false;
            });
            
            // Clear search
            document.getElementById('courseSearch').value = '';
            
            // Show all course items
            document.querySelectorAll('.course-item').forEach(item => {
                item.style.display = 'flex';
            });
            
            // Reset map
            applyFilters();
        }
        
        function updateStats() {
            const visibleMarkers = markerGroup.getLayers().length;
            const totalSchools = Object.keys(schoolData).length;
            const selectedCourses = document.querySelectorAll('#courseFilters input:checked').length;
            
            document.getElementById('schoolCount').textContent = visibleMarkers;
            document.getElementById('totalSchools').textContent = totalSchools;
            document.getElementById('selectedCourses').textContent = selectedCourses;
        }
        
        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            initFilters();
        });
    </script>
</body>
</html>
